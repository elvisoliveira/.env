
[cursor]
blink_interval = 500

[cursor.style]
blinking = "Always"

[font]
size = 11

[font.normal]
family = "Mononoki Nerd Font Mono"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/bin/bash"

[window]
opacity = 0.7

[general]
# dynamic_title = false
import = ["dracula.toml"]

[terminal]
