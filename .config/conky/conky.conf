conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Mononoki Nerd Font:size=12',
    gap_x = 20,
    gap_y = 40,
    minimum_height = 1040,
    minimum_width = 460,
    maximum_width = 520,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'conky',
    own_window_type = 'override',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    own_window_transparent = true
}

conky.text = [[
    $nodename${alignr}${time %H:%M}
    ${color grey}${time %A, %d %b %Y}${color}
    
    󰻠 System
    󰥔 Uptime${alignr}$uptime
    󰻠 CPU${alignr}${color #f38ba8}$cpu%${color}  ${execi 5 bash /home/elvisoliveira/.env/.config/conky/temperature.sh}
    ${cpubar 6}
    󰻠 Freq${alignr}$freq MHz
    󰢮 GPU${alignr}${execi 30 bash /home/elvisoliveira/.env/.config/conky/gpu_stats.sh name}
    󰢮 GPU Freq${alignr}${execi 5 bash /home/elvisoliveira/.env/.config/conky/gpu_stats.sh freq}
    󰍛 RAM${alignr}$mem / $memmax  ($memperc%)
    ${membar 6}
    󰘚 Swap${alignr}$swap / $swapmax  ($swapperc%)
    ${swapbar 6}
    󱊣 Battery${alignr}${battery_percent BAT0}%  ${execi 30 bash /home/elvisoliveira/.env/.config/conky/battery_time.sh}
    󰓅 Proc${alignr}$processes total / $running_processes running
    ${if_match ${cpu} > 80}${color #ff5555}[!!!] High CPU load${color}${endif}
    
    󰋊 Storage
      /${goto 150}${fs_used /}${alignr}${fs_free /}
    ${fs_bar 6 /}
      /home${goto 150}${fs_used /home}${alignr}${fs_free /home}
    ${fs_bar 6 /home}
      /files${goto 150}${fs_used /files}${alignr}${fs_free /files}
    ${fs_bar 6 /files}
      /vms${goto 150}${fs_used /vms}${alignr}${fs_free /vms}
    ${fs_bar 6 /vms}
    
    󰩟 Network
      Iface${alignr}${gw_iface}
      PHY IP${alignr}${addr enp43s0}
      VPN${alignr}${execi 10 bash /home/elvisoliveira/.env/.config/conky/vpn_info.sh summary}
      VPN IP${alignr}${execi 10 bash /home/elvisoliveira/.env/.config/conky/vpn_info.sh ip}
      Public${alignr}${execi 300 bash /home/elvisoliveira/.env/.config/conky/public_ip.sh}
      Up${alignr}${upspeed ${gw_iface}}/s
      Down${alignr}${downspeed ${gw_iface}}/s
    
    󰖟 Browser${goto 250}󰻠 CPU${alignr}󰍛 MEM
      Firefox${goto 250}${execi 5 bash /home/elvisoliveira/.env/.config/conky/browser_cpu.sh firefox}%${alignr}${execi 5 bash /home/elvisoliveira/.env/.config/conky/browser_mem.sh firefox}
      Chromium${goto 250}${execi 5 bash /home/elvisoliveira/.env/.config/conky/browser_cpu.sh chromium}%${alignr}${execi 5 bash /home/elvisoliveira/.env/.config/conky/browser_mem.sh chromium}
    
    󰥔 Timezones
      AMS${alignr}${execi 30 TZ=Europe/Amsterdam date +%H:%M}
      LON${alignr}${execi 30 TZ=Europe/London date +%H:%M}
      BSB${alignr}${execi 30 TZ=America/Sao_Paulo date +%H:%M}
    
    󰠓 Crypto
      BTC${alignr}${execi 300 sh -c "curl -s rate.sx/1BTC | cut -d . -f 1 | rev | fold -w3 | paste -sd'.' - | rev"}
      XMR${alignr}${execi 300 sh -c "curl -s rate.sx/1XMR | cut -d . -f 1 | rev | fold -w3 | paste -sd'.' - | rev"}
]]
