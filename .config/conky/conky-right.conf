conky.config = {
    out_to_x = false,
    out_to_wayland = true,
    alignment = 'top_right',
    xinerama_head = tonumber(os.getenv('CONKY_HEAD')) or 0,
    font = 'Mononoki Nerd Font:size=11',
    gap_x = 50,
    gap_y = 50,
    maximum_width = 370,
    own_window_transparent = true
}

conky.text = [[
+---------------------------------------+
| 󰣇 OS                                  |
+---------------------------------------+
| ${color grey}Distro:${color} Arch Linux
| ${color grey}Kernel:${color} $kernel
| ${color grey}Arch:${color} $machine
| ${color grey}Pacman pkgs:${color} ${execi 1800 pacman -Qq | wc -l}
| ${color grey}AUR pkgs:${color} ${execi 1800 pacman -Qm | wc -l}
+---------------------------------------+

+---------------------------------------+
| 󰋊 Storage
+---------------------------------------+
| ${color grey}mount${goto 50}uso${goto 118}%${goto 160}livre${color}
| ${color grey}/${color}${goto 50}${fs_bar 6,60 /}${goto 118}${if_match ${fs_used_perc /} > 85}${color #f38ba8}${endif}${fs_used_perc /}%${color}${goto 160}${fs_free /}
| ${color grey}/home${color}${goto 50}${fs_bar 6,60 /home}${goto 118}${if_match ${fs_used_perc /home} > 85}${color #f38ba8}${endif}${fs_used_perc /home}%${color}${goto 160}${fs_free /home}
| ${color grey}/vms${color}${goto 50}${fs_bar 6,60 /vms}${goto 118}${if_match ${fs_used_perc /vms} > 85}${color #f38ba8}${endif}${fs_used_perc /vms}%${color}${goto 160}${fs_free /vms}
| ${color grey}/files${color}${goto 50}${fs_bar 6,60 /files}${goto 118}${if_match ${fs_used_perc /files} > 85}${color #f38ba8}${endif}${fs_used_perc /files}%${color}${goto 160}${fs_free /files}
+---------------------------------------+

+---------------------------------------+
| 󰍛 Top Memory                          |
+---------------------------------------+
${execpi 5 ~/.config/conky/top_processes.sh mem 5}
+---------------------------------------+

+---------------------------------------+
| 󰓅 Top CPU                             |
+---------------------------------------+
${execpi 5 ~/.config/conky/top_processes.sh cpu 5}
+---------------------------------------+

+---------------------------------------+
| 󰠓 Crypto                              |
+---------------------------------------+
${execpi 3600 ~/.config/conky/crypto.sh}
+---------------------------------------+
]]
