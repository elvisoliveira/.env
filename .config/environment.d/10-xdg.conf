# Machine-specific paths: single source for systemd --user (read at login), fish
# (00-env.fish) and bash (.bashrc). Plain KEY=VALUE only: no quotes, no ${VAR},
# no inline comments, so every reader parses it the same way.

# Toolchains live in /files/tools (own partition).
PYENV_ROOT=/files/tools/pyenv
WORKON_HOME=/files/tools/virtualenvs
RBENV_ROOT=/files/tools/rbenv
SDKMAN_DIR=/files/tools/sdkman
GRADLE_USER_HOME=/files/tools/gradle
NVM_DIR=/files/tools/nvm
CARGO_HOME=/files/tools/cargo
RUSTUP_HOME=/files/tools/rustup
DENO_INSTALL=/files/tools/deno
PHPBREW_ROOT=/files/tools/phpbrew
PHPBREW_HOME=/files/tools/phpbrew
CODEX_HOME=/files/tools/codex
CLAUDE_CONFIG_DIR=/files/tools/claude
ANDROID_HOME=/files/tools/android/sdk
ANDROID_SDK_ROOT=/files/tools/android/sdk
GOPATH=/files/tools/go
# arduino-cli: DATA also relocates inventory.yaml (otherwise ~/.arduino15)
ARDUINO_DIRECTORIES_DATA=/files/tools/arduino/data
ARDUINO_DIRECTORIES_USER=/files/tools/arduino/user
ARDUINO_DIRECTORIES_DOWNLOADS=/files/tools/arduino/dl

# Caches live on /files too (XDG_CACHE_HOME covers pip, composer, fish, wezterm,
# browsers…; npm reads npmrc `cache=`).
XDG_CACHE_HOME=/files/cache
# hf-hub (Rust, Handy >=0.10) ignores XDG and only reads HF_HOME
HF_HOME=/files/cache/huggingface
KUBECACHEDIR=/files/cache/kube
SUPABASE_HOME=/files/cache/supabase
YARN_GLOBAL_FOLDER=/files/cache/yarn
# openssl 1.1 tools' ~/.rnd
RANDFILE=/files/cache/openssl.rnd
