dare.you.sure.on.reload=1
comment.block.makefile=#~
load.on.activate=1
margin.width=0
split.vertical=0
statusbar.visible=1
tabbar.multiline=1
title.full.path=2
toolbar.visible=0
wrap=1

lexilla.context.lpeg.color.theme=dark

default.file.ext=.txt

use.tabs=0
indent.size=4
tabsize=4

view.eol=1
view.whitespace=1
whitespace.size=2

# Vertical dotted indent guides every indent.size columns.
# examine=3 makes guides pass through empty lines using both surrounding
# non-empty lines — correct behaviour for most languages.
# highlight.indentation.guides highlights the guide matching the current
# brace pair when brace-matching fires.
view.indentation.guides=1
view.indentation.examine=3
highlight.indentation.guides=1

edge.column=80
edge.mode=1

save.position=1
save.recent=1

line.margin.width=4+
line.margin.visible=1

font.monospace=font:!Courier New,size:12
font.base=$(font.monospace)
font.small=$(font.monospace)
font.comment=$(font.monospace)
font.text=$(font.monospace)
font.text.comment=$(font.monospace)
font.embedded.base=$(font.monospace)
font.embedded.comment=$(font.monospace)
font.vbs=$(font.monospace)

transparency.90=E6
transparency.70=B3
transparency.50=80
transparency.30=4D

# Named colour palette reused across the rest of the file
colour.red=#FF0000
colour.blue=#0080FF
colour.grey=#1D1D1D
colour.black=#101010
colour.white=#FFFFFF
colour.green=#71FF1C
colour.yellow=#FFFF00

# Background highlight on literal matches from Find/Replace (F3 results)
find.mark=$(colour.green)
find.strip.incremental=2
# Underline drawn under the match while typing in the incremental Find box
find.indicator.incremental=style:compositionthick,colour:$(colour.green),under
find.close.on.find=0

# Highlight every other occurrence of the word under the caret (rounded orange
# box). Orange is complementary to the violet selection, so the two markers
# read as distinct functions at a glance.
highlight.current.word=1
highlight.current.word.indicator=style:roundbox,colour:#FF8C00,under,outlinealpha:140,fillalpha:80

# ---------------------------------------------------------------------------
# Change history — the visual trail Scintilla leaves as a document evolves.
# ---------------------------------------------------------------------------
# change.history is a bitmask; OR the flags you want together:
#     0 = off
#     1 = feature enabled (prerequisite for 2 and 4)
#     2 = margin markers (coloured bar in the line-number gutter)
#     4 = in-text indicators (translucent wash over the changed characters)
# Common values: 0 (off), 3 (margin only), 7 (margin + text). The feature
# is latched at file-load time, so edits to this property only take effect
# on newly opened buffers — reopen the file or restart SciTE after changing.
#change.history=7
#
# Four states are tracked. Each has a margin marker *and* two text
# indicators (one for inserted characters, one for deleted ones):
#   modified             -> edited and not yet saved
#   saved                -> edited, then saved in this session
#   reverted.to.origin   -> undone all the way back to what's on disk
#   reverted.to.modified -> undone back to an earlier saved/modified state
#
# --- Marker syntax (gutter bar) -------------------------------------------
# marker.<state>=style:<shape>,fore:#RRGGBB,back:#RRGGBB
#   style : shape drawn in the margin. Useful values:
#             leftrect   solid bar on the left edge (classic change bar)
#             fullrect   fills the full margin cell
#             bookmark   bookmark flag
#             arrow, circle, smallrect, shortarrow, ...
#   fore  : outline / symbol colour
#   back  : fill colour
# Example from the SciTE docs:
#   marker.saved=style:leftrect,fore:#00A000,back:#A0A000
#
# --- Indicator syntax (in-text wash) --------------------------------------
# indicator.<state>.<insertion|deletion>=style:<s>,colour:#RGB,<flags>
#   style         : how the indicator is drawn. Options:
#                     plain, squiggle, tt, diagonal, strike, hidden,
#                     box, roundbox, straightbox, fullbox, dash, dots,
#                     squigglelow, dotbox, squigglepixmap,
#                     compositionthick, compositionthin,
#                     textfore, gradient, gradientcentre,
#                     point, pointcharacter, pointtop
#                   Default: plain.
#   colour/color  : hex colour, e.g. #B8860B. Either spelling is accepted.
#                   Default: black.
#   fillalpha     : 0 (transparent) .. 255 (opaque) fill translucency.
#                   ONLY honoured by roundbox, straightbox, dotbox.
#                   Default: 30.
#   outlinealpha  : 0..255 outline translucency, same style restriction.
#                   Default: 50.
#   under         : draw the indicator UNDER the text (text stays crisp).
#   notunder      : draw OVER the text (can dim the glyphs). Default.
# Any attribute can be omitted; omit = use default.
#
# Palette picked for this dark theme — muted, low-alpha, translucent fills
# so the white text foreground stays legible on every state:
#   amber  -> modified, not yet saved
#   green  -> saved in this session
#   slate  -> reverted back to the on-disk original
#   violet -> reverted from origin back to a prior modification
indicator.modified.insertion=style:straightbox,colour:#B8860B,fillalpha:60,outlinealpha:0,under
indicator.modified.deletion=style:straightbox,colour:#B8860B,fillalpha:60,outlinealpha:0,under
indicator.saved.insertion=style:straightbox,colour:#4A5A6A,fillalpha:60,outlinealpha:0,under
indicator.saved.deletion=style:straightbox,colour:#3C6E47,fillalpha:60,outlinealpha:0,under
indicator.reverted.to.origin.insertion=style:straightbox,colour:#4A5A6A,fillalpha:55,outlinealpha:0,under
indicator.reverted.to.origin.deletion=style:straightbox,colour:#4A5A6A,fillalpha:55,outlinealpha:0,under
indicator.reverted.to.modified.insertion=style:straightbox,colour:#6A5A8A,fillalpha:55,outlinealpha:0,under
indicator.reverted.to.modified.deletion=style:straightbox,colour:#6A5A8A,fillalpha:55,outlinealpha:0,under
#
# Matching margin markers — commented out; uncomment (and set change.history
# to include flag 2, e.g. 3 or 7) to get a coloured bar in the gutter too.
#marker.modified=style:leftrect,fore:#B8860B,back:#B8860B
#marker.saved=style:leftrect,fore:#3C6E47,back:#3C6E47
#marker.reverted.to.origin=style:leftrect,fore:#4A5A6A,back:#4A5A6A
#marker.reverted.to.modified=style:leftrect,fore:#6A5A8A,back:#6A5A8A

# Base styles for untitled buffers (no lexer assigned yet)
# .32 = default text, .33 = line-number margin, .37 = indent guide
style.*.32=$(font.base),back:$(colour.black),fore:$(colour.white) # Default
style.*.33=back:$(colour.grey),$(font.base) # Line number
style.*.37=fore:#2A3442,back:$(colour.black) # Indent guide

# Status Bar
statusbar.text.1=\
Line: $(LineNumber); \
Column: $(ColumnNumber); \
Mode: $(OverType); \
EOL: $(EOLMode); \
Lines: $(NbOfLines); \
Extension: $(FileExt); \
Language: $(Language); \
Path: $(FilePath)

# Fold margin: background of the +/- triangle gutter, and the highlight stripe
# drawn when hovering a fold point
fold.margin.colour=#505050
fold.margin.highlight.colour=#101010

# Colour of the whitespace dots/arrows shown by view.whitespace=1. Neutral
# slate so it reads as "structural marker" and doesn't compete with the green
# find.mark or any comment colour.
whitespace.fore=#3A4452

# Colour of the blinking text cursor itself
caret.fore=#FFFFFF

# Selection: deep violet background with forced white text — chosen for
# maximum distance from every syntax colour in the palette (green, cyan,
# amber, teal, salmon), so selected text never blends with its token colour.
# selection.layer=1 draws the selection UNDER the text so selection.fore is
# applied on top (without this, some builds paint the background over the text
# and the fore colour is ignored).
# The 8-digit back colour embeds alpha in the last two hex digits (CC = ~80%
# opaque) — only honored when selection.layer >= 1.
selection.layer=1
selection.back=#5B21B6CC
selection.fore=$(colour.white)

# Current line marker: very faint white wash behind the line the caret is on.
# Alpha 20/255 is just enough to locate the line without obscuring the text.
caret.line.back=#FFFFFF
caret.line.back.alpha=20

# Symbolic colour names referenced by per-lexer style files in SciTE's share
# directory (cpp.properties, python.properties, etc). Changing one here
# propagates across every language that honours the convention.
colour.code.comment.box=fore:#CCFFCC,back:#202020   # /* ... */ block comments
colour.code.comment.line=fore:#D0F0D0               # // line comments
colour.code.comment.doc=fore:#D0F0D0                # /** ... */ doc comments
colour.text.comment=fore:#0000FF,back:#D0F0D0       # comments in plain-text lexers
colour.other.comment=fore:#A0C0C0                   # misc comment variants (shell, ini, ...)
colour.embedded.comment=back:#E0EEFF                # comments inside embedded languages (e.g. JS in HTML)
colour.embedded.js=back:#F0F0FF                     # background tint for embedded JS blocks
colour.notused=back:#FF0000                         # loud red flag for styles that shouldn't appear
colour.number=fore:#FF99AA                          # numeric literals (salmon)
colour.keyword=fore:#00A0C0                         # primary language keywords (teal cyan)
colour.keyword2=fore:#B99C4C                        # secondary keywords / types (amber)
colour.keyword3=fore:#7788DD                        # tertiary keywords (lavender)
colour.string=fore:#096283                          # "string literals"
colour.char=fore:#096283                            # 'char literals'
colour.operator=fore:#F0E0B0                        # + - * / = etc. (pale gold)
colour.preproc=fore:#D0D000                         # #include / #define preprocessor directives
colour.error=fore:#FFFF00,back:#A05050               # lexer error tokens (yellow on rust)

